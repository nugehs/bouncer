name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # required for npm Trusted Publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1; upgrade so
      # `npm publish` can authenticate via id-token. Requires Trusted
      # Publishing to be configured for @nugehs/bouncer on npmjs.com
      # (repo nugehs/bouncer, workflow release.yml).
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      # bouncer has zero runtime/dev dependencies — nothing to install.
      - name: Test
        run: npm test

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG section found for $VERSION" > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md

      - name: Publish to npm
        run: npm publish --access public

  publish-mcp:
    name: Publish to MCP Registry
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for MCP Registry GitHub OIDC login
    steps:
      - uses: actions/checkout@v6

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" | tar xz mcp-publisher

      - name: Log in to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      # npm can take a minute to expose a fresh version; the registry validates against it.
      - name: Wait for npm to expose this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if [ "$(npm view "@nugehs/bouncer@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then exit 0; fi
            echo "waiting for npm ($i/30)…"; sleep 10
          done
          echo "npm never exposed $VERSION" >&2; exit 1

      - name: Publish server.json
        run: |
          for i in 1 2 3; do ./mcp-publisher publish && exit 0; sleep 20; done
          exit 1
