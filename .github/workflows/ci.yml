name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: npm test
      - name: Smoke-test CLI
        run: |
          node src/cli.js packs
          node src/cli.js list --config tests/fixtures/polyglot/bouncer.config.json
          node src/cli.js doctor --config tests/fixtures/polyglot/bouncer.config.json
          node src/cli.js check --config tests/fixtures/polyglot/bouncer.config.json --json --no-fail > /dev/null
